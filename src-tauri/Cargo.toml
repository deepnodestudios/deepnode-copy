[package]
name = "deepnode-gui"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
deepnode-core = { path = "../crates/deepnode-core" }
deepnode-db = { path = "../crates/deepnode-db" }
tauri = { version = "2.0", features = ["tray-icon", "image-png", "image-ico", "custom-protocol"] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
windows = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
sentry = { version = "0.49", default-features = false, features = ["backtrace", "contexts", "panic", "transport", "reqwest", "rustls"] }
sentry-tracing = "0.49"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream"] }
futures-util = "0.3"

